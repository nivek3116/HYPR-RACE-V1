# ========================================================== #
#                      HYPER - RICE                          #
# ========================================================== #

# ========================================================== #
# FONDO                                                      #
# ========================================================== #
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
    contrast = 0.90
    brightness = 0.80
    vibrancy = 0.1696
}

# ========================================================== #
# CAMPO DE CONTRASEÑA                                        #
# ========================================================== #
input-field {
    monitor =
    size = 270, 50
    position = 0, -220
    outline_thickness = 1
    rounding = 25
    outer_color = rgba(255, 255, 255, 0.15)
    inner_color = rgba(0, 0, 0, 0.50)
    font_color = rgba(255, 255, 255, 0.95)
    font_family = Poppins
    placeholder_text = 
    dots_size = 0.25
    dots_spacing = 0.35
    dots_rounding = -1
    dots_center = true
    fade_on_empty = true
    check_color = rgba(255, 255, 255, 0.60)
    fail_color = rgba(239, 71, 58, 0.85)
    fail_text = <span foreground="##ffffff90"><i>Contraseña incorrecta ($ATTEMPTS)</i></span>
    capslock_color = rgba(245, 158, 11, 0.85)
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.60)
    shadow_boost = 1.2
    halign = center
    valign = center
}

# ========================================================== #
# ELEMENTOS VISUALES (RELOJ Y CANDADO)                       #
# ========================================================== #
label {
    monitor =
    text = <span>  󰌾  </span>
    position = 0, 390
    font_family = JetBrainsMono Nerd Font Propo
    font_size = 28
    color = rgba(255, 255, 255, 0.60)
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.70)
    shadow_boost = 1.2
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H"
    position = 0, 112
    font_family = Modak
    font_size = 160
    color = rgba(255, 255, 255, 1.0)
    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.85)
    shadow_boost = 1.4
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%M"
    position = 0, -50
    font_family = Modak
    font_size = 160
    color = rgba(255, 255, 255, 1.0)
    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.85)
    shadow_boost = 1.4
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    font_family = Poppins Medium, Poppins
    font_size = 20
    color = rgba(255, 255, 255, 0.75)
    position = 0, -500
    halign = center
    valign = center
}
