# ========================================================== #
#                      HYPER - RICE                          #
# ========================================================== #

# ========================================================== #
# FUENTE                                                     #
# ========================================================== #
font_family      MonaspiceNe Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# ========================================================== #
# VENTANA Y TRANSPARENCIA                                    #
# ========================================================== #
window_padding_width        10
background_opacity          0.50
background_blur             1
dynamic_background_opacity  yes
hide_window_decorations     yes
confirm_os_window_close     0

# ========================================================== #
# CURSOR                                                     #
# ========================================================== #
cursor                #ffffff
cursor_text_color     #000000
cursor_shape          block
cursor_blink_interval 1

# ========================================================== #
# COMPORTAMIENTO Y ENLACES                                   #
# ========================================================== #
scrollback_lines      5000
copy_on_select        yes
strip_trailing_spaces smart
url_color             #cbd5e1
url_style             curly
open_url_with         default
shell_integration     enabled

# ========================================================== #
# BORDES Y PESTAÑAS                                          #
# ========================================================== #
active_border_color   #ef473a
inactive_border_color #292e35
bell_border_color     #cb2d3e

tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_align           left
tab_bar_background      #0f0f14
active_tab_foreground   #000000
active_tab_background   #ffffff
active_tab_font_style   bold
inactive_tab_foreground #64748b
inactive_tab_background #181920
inactive_tab_font_style normal

# ========================================================== #
# COLORES                                                    #
# ========================================================== #
foreground            #ffffff
background            #000000
selection_foreground  #000000
selection_background  #ffffff

color0  #15161b
color8  #475569
color1  #94a3b8
color9  #cbd5e1
color2  #cbd5e1
color10 #f1f5f9
color3  #94a3b8
color11 #e2e8f0
color4  #64748b
color12 #94a3b8
color5  #cbd5e1
color13 #f8fafc
color6  #cbd5e1
color14 #ffffff
color7  #cbd5e1
color15 #ffffff

# ========================================================== #
# ATAJOS DE TECLADO                                          #
# ========================================================== #
map ctrl+shift+n new_window
map ctrl+t new_tab
map ctrl+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0

map ctrl+shift+a>m set_background_opacity +0.05
map ctrl+shift+a>l set_background_opacity -0.05
map ctrl+shift+a>d set_background_opacity default
map ctrl+shift+a>1 set_background_opacity 1
